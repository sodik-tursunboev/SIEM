<button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle navigation menu">&#9776;</button>
<nav class="sidebar" id="sidebar">

  <div class="sidebar-search">

  <div class="sidebar-nav">

    <div class="nav-group">
      <div class="nav-group-label">Detect</div>

      <a href="{{ url_for('sigma_rules.sigma_page') }}" class="{{ 'active' if request.path == '/sigma' else '' }}">Sigma Rules</a>
    </div>

    <div class="nav-group">
      <div class="nav-group-label">Investigate</div>
      <a href="{{ url_for('hunting') }}" class="{{ 'active' if request.path == '/hunting' else '' }}">Threat Hunting</a>
      <a href="{{ url_for('cases.cases_page') }}" class="{{ 'active' if request.path.startswith('/cases') else '' }}">Cases</a>
      <a href="{{ url_for('correlation.chains_page') }}" class="{{ 'active' if request.path == '/chains' else '' }}">Chains</a>
      <a href="{{ url_for('heatmap') }}" class="{{ 'active' if request.path == '/heatmap' else '' }}">MITRE Heatmap</a>
      <a href="{{ url_for('risk_page') }}" class="{{ 'active' if request.path == '/risk' else '' }}">Risk</a>
      <a href="{{ url_for('assets_page') }}" class="{{ 'active' if request.path == '/assets' else '' }}">Assets</a>
      <a href="{{ url_for('iocs_page') }}" class="{{ 'active' if request.path == '/iocs' else '' }}">IOC Watchlist</a>
      <a href="{{ url_for('timeline_page') }}" class="{{ 'active' if request.path == '/timeline' else '' }}">Timeline</a>
    </div>

    <div class="nav-group">
      <div class="nav-group-label">Respond</div>
      <a href="{{ url_for('soar.soar_page') }}" class="{{ 'active' if request.path == '/soar' else '' }}">SOAR</a>
    </div>

    <div class="nav-group">
      <div class="nav-group-label">Intelligence</div>
      <a href="{{ url_for('ai_summary.ai_summary_page') }}" class="{{ 'active' if request.path == '/ai-summary' else '' }}">AI Summary</a>
    </div>

    {% if current_role == 'Admin' %}
    <div class="nav-group">
      <div class="nav-group-label">Admin</div>
      <a href="{{ url_for('users_page') }}" class="{{ 'active' if request.path == '/users' else '' }}">Users</a>

  <div class="sidebar-pulse" id="ingestion-pulse" title="Live ingestion rate">
    <div class="pulse-label">Ingestion</div>
    <div class="pulse-bars" id="pulse-bars"></div>
  </div>

  <div class="sidebar-footer">
    <button class="icon-btn" id="theme-toggle" title="Toggle light/dark theme">&#9681;</button>
    <a class="user-badge" href="{{ url_for('account_page') }}" title="Change password"><b>{{ current_username }}</b> &middot; {{ current_role }}</a>
    <a class="btn" href="{{ url_for('logout') }}">Logout</a>
  </div>
</nav>

<script>
(function(){
  const toggle = document.getElementById('theme-toggle');
  if (toggle){
    toggle.addEventListener('click', function(){
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      document.documentElement.setAttribute('data-theme', isLight ? 'dark' : 'light');
      localStorage.setItem('siem-theme', isLight ? 'dark' : 'light');
    });
  }
  const search = document.getElementById('global-search');
  if (search){
    search.addEventListener('keydown', function(e){
      if (e.key === 'Enter' && search.value.trim()){
        window.location.href = '/hunting?search=' + encodeURIComponent(search.value.trim());
      }
    });
  }

  // Mobile menu toggle - only relevant/visible under the 900px breakpoint,
  // but harmless to wire up unconditionally.
  const menuToggle = document.getElementById('mobile-menu-toggle');
  const sidebar = document.getElementById('sidebar');
  if (menuToggle && sidebar){
    menuToggle.addEventListener('click', function(){
      sidebar.classList.toggle('open');
    });
    // Close the menu after navigating, so it doesn't stay open covering
    // the new page on the next load.
    sidebar.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => sidebar.classList.remove('open'));
    });
  }
})();

// Signature element: live ingestion-rate histogram. Polls the real log
// count periodically and renders the deltas as a small bar sparkline -
// this is genuinely data-driven (shows real ingestion activity), not
// decorative, which is the whole point of it being here.
(function(){
  const MAX_BARS = 20;
  let history = [];
  let lastTotal = null;

  async function pollIngestionRate(){
    try {
      const r = await fetch('/api/logs?limit=1');
      if (!r.ok) return;
      const data = await r.json();
      const total = data.total || 0;
      if (lastTotal !== null){
        const delta = Math.max(0, total - lastTotal);
        history.push(delta);
        if (history.length > MAX_BARS) history.shift();
        renderBars();
      }
      lastTotal = total;
    } catch (e) { /* silent - a failed poll just skips this cycle */ }
  }

  function renderBars(){
    const container = document.getElementById('pulse-bars');
    if (!container) return;
    const max = Math.max(1, ...history);
    container.innerHTML = history.map(v => {
      const pct = Math.max(6, Math.round((v / max) * 100));
      return `<div class="pulse-bar" style="height:${pct}%"></div>`;
    }).join('');
  }

  pollIngestionRate();
  setInterval(pollIngestionRate, 4000);
})();
</script>
