<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini SIEM — MITRE ATT&amp;CK Heatmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="{{ url_for('static', filename='utils.js') }}"></script>
<script>(function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('siem-theme') || 'dark'); })();</script>
<style>
  .tactic-col { display:flex; flex-direction:column; gap:8px; min-width:190px; }
  .tactic-header {
    font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--text-dim); padding-bottom:8px; border-bottom:1px solid var(--border); margin-bottom:2px;
  }
  .heat-cell {
    border-radius:8px; padding:10px 12px; font-family:var(--mono); border:1px solid var(--border);
  }
  .heat-cell .tid { font-size:11px; font-weight:700; }
  .heat-cell .tname { font-size:10.5px; color:var(--text-dim); margin-top:2px; }
  .heat-cell .tcount { font-size:18px; font-weight:700; margin-top:6px; }
  .heat-row { display:flex; gap:14px; overflow-x:auto; padding-bottom:8px; align-items:flex-start; }
</style>
</head>
<body>
{% include '_nav.html' %}
<main class="page">

  <div class="card">
    <div class="panel-title">MITRE ATT&amp;CK Heatmap</div>
    <div class="panel-sub">Every technique your rules have actually detected, grouped by tactic, colored by how often it's fired. A cold heatmap for a tactic doesn't mean you're safe from it - it means nothing's *tripped a rule* for it yet.</div>
    <div class="heat-row" id="heatmap-container"></div>
  </div>

</main>
<footer>Mini SIEM · MITRE ATT&amp;CK Heatmap</footer>

<script>
function heatColor(count, max){
  const ratio = max > 0 ? count / max : 0;
  if (ratio > 0.66) return {bg: 'rgba(229,72,77,.18)', border: 'rgba(229,72,77,.5)', text: 'var(--accent)'};
  if (ratio > 0.33) return {bg: 'rgba(217,164,65,.18)', border: 'rgba(217,164,65,.5)', text: 'var(--warn)'};
  if (ratio > 0) return {bg: 'rgba(91,141,239,.14)', border: 'rgba(91,141,239,.4)', text: 'var(--info)'};
  return {bg: 'transparent', border: 'var(--border)', text: 'var(--text-dim)'};
}

async function loadHeatmap(){
  const r = await fetch('/api/mitre-matrix');
  const matrix = await r.json();
  const container = document.getElementById('heatmap-container');

  const tactics = Object.keys(matrix).sort();
  if (tactics.length === 0){
    container.innerHTML = '<div class="empty">No MITRE-tagged alerts yet - trigger some detections and check back.</div>';
    return;
  }

  let maxCount = 0;
  for (const t of tactics) for (const tech of matrix[t]) maxCount = Math.max(maxCount, tech.count);

  let html = '';
  for (const tactic of tactics){
    html += `<div class="tactic-col"><div class="tactic-header">${escapeHtml(tactic)}</div>`;
    const techs = matrix[tactic].sort((a,b) => b.count - a.count);
    for (const tech of techs){
      const c = heatColor(tech.count, maxCount);
      html += `<div class="heat-cell" style="background:${c.bg};border-color:${c.border};">
        <div class="tid" style="color:${c.text};">${escapeHtml(tech.mitre_id)}</div>
        <div class="tname">${escapeHtml(tech.mitre_technique)}</div>
        <div class="tcount" style="color:${c.text};">${tech.count}</div>
      </div>`;
    }
    html += `</div>`;
  }
  container.innerHTML = html;
}

loadHeatmap();
setInterval(loadHeatmap, 10000);
</script>
</body>
</html>
