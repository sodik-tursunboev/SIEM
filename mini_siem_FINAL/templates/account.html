<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini SIEM — My Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="{{ url_for('static', filename='utils.js') }}"></script>
<script>(function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('siem-theme') || 'dark'); })();</script>
</head>
<body>
{% include '_nav.html' %}
<main class="page" style="max-width:480px;">

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash flash-{{ 'error' if category == 'error' else 'ok' }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <div class="card">
    <div class="panel-title">My Account</div>
    <div class="panel-sub">Signed in as <b>{{ current_username }}</b> ({{ current_role }})</div>

    <form method="POST" class="stack-form" style="display:flex; flex-direction:column; gap:12px; margin-top:14px;">
      <div>
        <label class="field-label">Current password</label>
        <input type="password" name="current_password" required>
      </div>
      <div>
        <label class="field-label">New password</label>
        <input type="password" name="new_password" required minlength="4">
      </div>
      <div>
        <label class="field-label">Confirm new password</label>
        <input type="password" name="confirm_password" required minlength="4">
      </div>
      <button class="btn btn-primary" type="submit">Change password</button>
    </form>
  </div>

</main>
<footer>Mini SIEM · My Account</footer>
</body>
</html>
