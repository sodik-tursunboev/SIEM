title: Credential Dumping Tool Execution
id: 1d2e3f4a-5b6c-7d8e-9f0a-1b2c3d4e5f6a
status: stable
description: >
  Detects execution of well-known credential dumping tools (Mimikatz and
  common aliases). These tools extract plaintext passwords, hashes, or
  Kerberos tickets from memory - almost never legitimate outside of
  authorized red-team engagements.
logsource:
  category: process_creation
detection:
  selection:
    EventID: 4688
    CommandLine:
      - '*mimikatz*'
      - '*sekurlsa*'
      - '*lsadump*'
  condition: selection
level: critical
tags:
  - attack.credential_access
  - attack.t1003
