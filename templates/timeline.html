<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini SIEM — Attack Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="{{ url_for('static', filename='utils.js') }}"></script>
<script>(function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('siem-theme') || 'dark'); })();</script>
<style>
  .tl-item { display:flex; gap:14px; padding:10px 0; border-left:2px solid var(--border); position:relative; padding-left:20px; margin-left:6px; }
  .tl-item::before {
    content:''; position:absolute; left:-7px; top:14px; width:12px; height:12px; border-radius:50%;
    background:var(--surface); border:2px solid var(--text-dim);
  }
  .tl-item.is-alert::before { border-color:var(--accent); }
  .tl-time { font-family:var(--mono); font-size:11px; color:var(--text-dim); min-width:130px; }
  .tl-body { font-family:var(--sans); font-size:13px; }
  .tl-tag { font-family:var(--mono); font-size:10px; color:var(--text-dim); text-transform:uppercase; }
</style>
</head>
<body>
{% include '_nav.html' %}
<main class="page">

  <div class="card">
    <div class="panel-title">Attack Timeline</div>
    <div class="panel-sub">Chronological reconstruction of everything a user or host did - the incident-response view. Logs and alerts merged into one sequence.</div>
    <div class="filterbar">
      <label>Look up</label>
      <select id="f-type"><option value="user">User</option><option value="host">Host</option></select>
      <input type="text" id="f-value" placeholder="username or hostname...">
      <button class="btn btn-primary" onclick="loadTimeline();">Show timeline</button>
    </div>
    <div id="timeline-container"></div>
  </div>

</main>
<footer>Mini SIEM · Attack Timeline</footer>

<script>
function fmtTime(iso){ const d = new Date(iso + 'Z'); return d.toLocaleString([], {month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit'}); }

async function loadTimeline(){
  const type = document.getElementById('f-type').value;
  const value = document.getElementById('f-value').value.trim();
  const container = document.getElementById('timeline-container');
  if (!value){ container.innerHTML = '<div class="empty">Enter a username or hostname above.</div>'; return; }

  const r = await fetch(`/api/timeline?type=${type}&value=${encodeURIComponent(value)}`);
  const events = await r.json();
  if (!Array.isArray(events) || events.length === 0){
    container.innerHTML = '<div class="empty">No activity found for that ' + type + '.</div>';
    return;
  }

  let html = '';
  for (const e of events){
    const isAlert = e._kind === 'alert';
    const label = isAlert
      ? `<span class="sev sev-${e.severity}">${escapeHtml(e.severity)}</span> ${escapeHtml(e.rule_name)}${e.mitre_id ? ` <span class="mitre-tag">${escapeHtml(e.mitre_id)}</span>` : ''}`
      : `<span class="tl-tag">${escapeHtml(e.source)}</span> ${escapeHtml(e.event_type)}${e.message ? ' — ' + escapeHtml(e.message.slice(0,120)) : ''}`;
    html += `<div class="tl-item ${isAlert ? 'is-alert' : ''}">
      <div class="tl-time">${fmtTime(e.timestamp)}</div>
      <div class="tl-body">${label}</div>
    </div>`;
  }
  container.innerHTML = html;
}

// Support arriving here from a link elsewhere (e.g. /timeline?type=host&value=WS-1)
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('value')){
  document.getElementById('f-type').value = urlParams.get('type') || 'user';
  document.getElementById('f-value').value = urlParams.get('value');
  loadTimeline();
}
</script>
</body>
</html>
