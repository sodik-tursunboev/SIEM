name: Detection regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  admin-share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Flask==3.1.3 PyYAML==6.0.2 requests==2.33.0
      - run: python -m unittest discover -s tests -v
