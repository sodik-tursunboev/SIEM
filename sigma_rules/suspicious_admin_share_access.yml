title: Suspicious Access to Administrative Share
id: 2e3f4a5b-6c7d-8e9f-0a1b-2c3d4e5f6a7b
status: experimental
description: >
  Detects access or access checks to C$ and ADMIN$ in Windows Security
  file-share events (5140 and 5145). Administrative access can be legitimate;
  investigate the account, source host and requested object before escalation.
logsource:
  product: windows
  service: security
detection:
  selection_event:
    EventID:
      - 5140
      - 5145
    Channel: Security
  selection_share:
    ShareName|endswith:
      - '\ADMIN$'
      - '\C$'
  condition: selection_event and selection_share
level: medium
tags:
  - attack.lateral_movement
  - attack.t1570
falsepositives:
  - Authorized remote administration and software deployment
