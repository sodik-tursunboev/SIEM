title: Encoded PowerShell Command Execution
id: 8c2f6e6a-3b1a-4b8e-9c1a-1a2b3c4d5e6f
status: stable
description: >
  Detects PowerShell invoked with an encoded (-enc / -EncodedCommand)
  command line. Attackers use this to hide the real command from casual
  log review and to dodge simple string-matching defenses.
logsource:
  category: process_creation
detection:
  selection:
    EventID: 4688
    CommandLine: '*-enc*'
  condition: selection
level: high
tags:
  - attack.execution
  - attack.t1059.001
